# Asura OS Low-Latency Developer Performance Tuning

# Memory, VFS cache, and scheduler parameters

# ZRAM & memory reclamation tuning
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.page-cluster = 0

# Low-latency networking with BBR congestion control
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
