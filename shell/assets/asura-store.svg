<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222735"/>
      <stop offset="100%" stop-color="#12151e"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#2a3243" stroke-width="2"/>

  <!-- Handle Shadow -->
  <path d="M 196 148 C 196 76, 316 76, 316 148" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round" opacity="0.5"/>
  <!-- Handle -->
  <path d="M 196 144 C 196 72, 316 72, 316 144" fill="none" stroke="url(#handle)" stroke-width="20" stroke-linecap="round"/>
  <!-- Handle Joint Fasteners -->
  <rect x="186" y="140" width="20" height="24" rx="6" fill="#64748b"/>
  <rect x="306" y="140" width="20" height="24" rx="6" fill="#64748b"/>

  <!-- Bag Shadow -->
  <path d="M 112 164 L 400 164 Q 426 164 422 196 L 404 416 Q 400 448 368 448 L 144 448 Q 112 448 108 416 L 90 196 Q 86 164 112 164 Z" 
        fill="#000000" opacity="0.6"/>

  <!-- Bag Body -->
