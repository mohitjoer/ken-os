        fill="url(#bag)" stroke="#384257" stroke-width="3"/>

  <!-- Bag Top Fold Trim -->
  <path d="M 100 196 L 412 196" stroke="#2b3242" stroke-width="3"/>

  <!-- 2x2 App Grid -->
  <!-- App 1: Star / Discover -->
  <rect x="176" y="228" width="70" height="70" rx="18" fill="#ffffff"/>
  <path d="M 211 245 Q 211 263 229 263 Q 211 263 211 281 Q 211 263 193 263 Q 211 263 211 245 Z" fill="#0f172a"/>

  <!-- App 2: Download / Install -->
  <rect x="266" y="228" width="70" height="70" rx="18" fill="#1b202c" stroke="#4b5568" stroke-width="2"/>
  <path d="M 301 246 L 301 274 M 291 265 L 301 275 L 311 265 M 289 283 L 313 283" 
        fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- App 3: Code / Dev Tools -->
  <rect x="176" y="318" width="70" height="70" rx="18" fill="#1b202c" stroke="#4b5568" stroke-width="2"/>
  <path d="M 197 353 L 206 344 M 225 344 L 216 353 M 205 362 L 217 362" 
        fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

