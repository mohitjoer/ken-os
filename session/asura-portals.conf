# Asura portal backend preference.
#
# Packaged at /usr/share/asura/session/asura-portals.conf. Adoption writes the
# *user* file at ~/.config/xdg-desktop-portal/asura-portals.conf rather than the
# system one, for three reasons: it needs no root, it is a single `rm` away, and
# it does not modify a file a base-layer package owns.
#
# Section headers are the *impl* portal interface names the backends declare in
# their .portal files — org.freedesktop.impl.portal.Screenshot and friends. The
# dispatcher matches a section against the Interfaces= lines of the loaded
# .portal files, so a section header must be spelled exactly as the backend
# spells it. An older draft of this file used an org.gnome.impl.portal. prefix;
# no .portal file declares those names, so every such section matched nothing and
# the interface silently fell to the generic portals.conf — which is how
# Screenshot ended up on gtk, which does not implement it, and the Screenshot
# portal disappeared from the bus.
#
# GlobalShortcuts is deliberately absent. The shell owns global shortcuts
# directly; naming a backend here would hand the dispatcher's slot for the
# interface to a backend nothing on this desktop calls through it.
#
# Secret is not named. No installed backend implements it: gtk does not, and the
# lxqt backend — the light one, libfm-qt6, libkf6windowsystem6, Qt6's core, dbus,
# gui and widgets, nothing that competes with the shell — is not in the image
# yet. Naming a backend that cannot serve an interface is worse than naming none,
# because a reader checking the file sees a confident answer. When lxqt is
# packaged, add a Secret section naming it.

[default]
default=hyprland;gtk;

[org.freedesktop.impl.portal.ScreenCast]
use=hyprland;

[org.freedesktop.impl.portal.Screenshot]
use=hyprland;

[org.freedesktop.impl.portal.FileChooser]
use=gtk;

[org.freedesktop.impl.portal.OpenURI]
use=gtk;

[org.freedesktop.impl.portal.Print]
use=gtk;

# Access is the one that was silently breaking Camera.
#
# Camera is not a backend interface. It is implemented by xdg-desktop-portal
# itself — desktop-portal/camera.c is part of the dispatcher binary, not a
# backend — and it opens PipeWire only after asking an Access backend whether the
# user consents. No backend implements Camera, so the obvious reading of "no
# backend has Camera" is that Camera is unsupported. It is not: the dispatcher
# has had it all along, and it was never reaching a backend that could consent.
#
# With [default] set to hyprland, an interface nothing names falls to the
# default, so Access was being asked of the Hyprland backend — which does not
# implement it. The dispatcher's own Camera portal has therefore been unable to
# open a device on this desktop. gtk does implement Access, and naming it
# explicitly is the whole fix.
#
# This does not change Screenshot. The Hyprland backend implements Screenshot
# itself and never goes through the dispatcher's Access path; Access is consulted
# for the portals the dispatcher implements directly.
[org.freedesktop.impl.portal.Access]
use=gtk;

[preferred]
default=*
