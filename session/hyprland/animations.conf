# Asura's animation set: short and cheap by construction.
#
# Hyprland's animation tree hangs every leaf under `global`, so one line sets
# the whole desktop: 2 deciseconds — 200ms — on the compositor's built-in
# default curve. Leaves without a style of their own fade in place, which is
# the cheapest motion there is; workspaces restate the same line with the
# slide style, because a slide reads better when the whole workspace moves.
# No custom beziers and no popin or other scale styles — those make windows
# re-render every frame, which is exactly the cost this set avoids.
#
# The Hub's generator (asura-hubd settings.go) mirrors this feel when it
# restates the base set, and the master switch lives in the Hub's Animations
# page (desktop.appearance.animations).
animations {
    enabled = true
}

animation = global, 1, 2, default
animation = workspaces, 1, 2, default, slide
