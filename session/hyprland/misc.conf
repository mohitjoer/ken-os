misc {
    # keyboard focus follows an app's activation request, else a window mapping
    # off the focused monitor comes up un-typeable (Discord, Vivaldi)
    focus_on_activate = true
    # a window focused while another is fullscreen stays usable instead of
    # being hidden behind it, so Alt+Tab and the switcher reach every window
    on_focus_under_fullscreen = 1
    # pressing the key for the workspace you are already on returns to the
    # previous one, so a single key toggles between two workspaces
    workspace_back_and_forth = true
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # input is the compositor-native way out of DPMS, so a dead or late idle
    # client cannot leave the panel black
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    # a locker that crashes while locked would otherwise wedge the session on a
    # black screen that eats every key
    allow_session_lock_restore = true
    # a dispatcher resize jumps in one frame; animating it lets Hyprland
    # texture-scale the window instead of making the app re-lay-out mid-jump
    animate_manual_resizes = true
    # suppress warning toasts for intentionally configured desktop identity
    disable_xdg_env_checks = true
}

xwayland {
    force_zero_scaling = true
    use_nearest_neighbor = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

